name: Feature request
description: A Character Animator capability, tool or workflow the server does not cover yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The animation or delivery task that is not expressible today
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Proposed tool, argument or result change
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This changes an existing tool contract
        - label: This adds a mutation of a Character Animator project
