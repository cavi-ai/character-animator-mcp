[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "cavi-character-animator-mcp"
dynamic = ["version"]
description = "MCP server for Adobe Character Animator: project copies, session ownership, native evidence and export intake"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CAVI AI" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "character-animator",
    "adobe",
    "animation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.15"
dependencies = [
    "anyio>=4.5,<5",
    "cavi-mcp-core[media]>=0.1.8,<0.2",
    "mcp>=2.3,<3",
    "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/cavi-ai/character-animator-mcp#readme"
Repository = "https://github.com/cavi-ai/character-animator-mcp"
Issues = "https://github.com/cavi-ai/character-animator-mcp/issues"
Changelog = "https://github.com/cavi-ai/character-animator-mcp/blob/main/CHANGELOG.md"

[project.scripts]
cavi-character-animator-mcp = "cavi_character_animator_mcp.server:main"

[dependency-groups]
dev = ["pillow>=13.0,<14", "ruff>=0.14,<1"]

# The version comes from the git tag: vX.Y.Z builds X.Y.Z, later commits X.Y.(Z+1).devN+g<sha>.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/cavi_character_animator_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/evals", "/docs", "/scripts", "/package.json", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["TRY004"]
